name: CI

on:
  pull_request:
  push:
    branches: [master, beta]

jobs:
  backend-mcp:
    name: backend-mcp (tsc + vitest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend-mcp
          path: backend-mcp/coverage/
          retention-days: 14

  frontend:
    name: frontend (vitest + coverage + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      # 前端依赖漏洞审计硬门槛：npm audit 高危及以上视为失败
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14

  frontend-visual:
    name: frontend-visual (playwright 视觉基线)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diff
          path: frontend/test-results/
          retention-days: 14

  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pytest pytest-cov ruff==0.16.3 pip-audit
      # 静态检查硬门槛：ruff 全绿（选集中规则见 backend/pyproject.toml [tool.ruff.lint]）
      - run: ruff check .
      # 依赖漏洞审计硬门槛：锁定版本 + 官方漏洞库，0 已知漏洞
      - run: pip-audit -r requirements.lock --no-deps
      # 覆盖率硬门槛（防回退）：2026-08-21 T38 后实测 91%（CI 报告 88%）, 门槛 80% 留 8-11pp 裕量
      # 覆盖率报告见 Actions artifact；本地复现: python -m pytest --cov=. --cov-config=.coveragerc
      - run: python -m pytest -q --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 14
