[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TRY002", "TRY301", "G", "DTZ", "PLW", "PIE", "BLE", "S110", "S112"]
# 存量违规分批治理中(见 docs/backend-coding-standards.md §10 治理清单)。
# 每完成一批,从 ignore 移除对应规则,让 ruff 重新生效监督回归。
ignore = [
    # 中文注释/字符串被误判为歧义 unicode(仓库全中文注释,整组豁免)
    "RUF001", "RUF002", "RUF003",
    # 日志 f-string 写法(仓库既有惯例,621 处;性能影响可忽略,改造成本高,按惯例豁免)
    "G004",
    # 风格类零散项(低优先,随治理顺手修)
    "E501",     # 243 处超行宽(存量,不阻断)
    "TRY003",   # 193 处 raise 长消息:错误消息即任务失败原因/领域数据,逐消息建异常类过度设计,整组豁免
    "TRY300",   #  56 处 try/except 后兜底语句:fallback-after-except 惯用法,移 else 语义不符,整组豁免
]

[tool.ruff.lint.per-file-ignores]
# E402(import 不在文件顶部)为平台类文件入口/兼容性写法,按模式豁免
"app.py" = ["E402"]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
"services/*" = ["E402"]
"ext_api/*" = ["E402"]
"impl/*/platform.py" = ["E402"]
"impl/zhihu/platform.py" = ["E402"]


[tool.mypy]
# 渐进式类型检查: 先锁定核心域(services/ext_api), 随标注覆盖扩展
python_version = "3.12"
files = ["services", "ext_api"]
follow_imports = "skip"          # 外部未标注模块跳过
ignore_missing_imports = true    # 三方库无 stubs 不报错
check_untyped_defs = false       # 未标注函数体暂不深查(随治理逐步收紧)
warn_unused_ignores = true
no_implicit_optional = true
